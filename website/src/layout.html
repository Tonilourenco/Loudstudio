<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">{{alternates}}
<meta name="theme-color" content="#0b0c0e">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="Loudstudio">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/img/brand/mark-gold-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/brand/mark-gold-180.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/fonts/archivo-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/manrope-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/style.css?v={{v}}">
<script>document.documentElement.classList.add("js")</script>
<script src="/assets/js/main.js?v={{v}}" defer></script>{{head_extra}}
</head>
<body class="{{body_class}}">
{{header}}
<main id="conteudo" tabindex="-1">
{{content}}
</main>
{{footer}}
</body>
</html>
