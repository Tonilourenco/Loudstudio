[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "loudstudio"
version = "0.1.0"
description = "Soundcard-based analyser for comparing mixing desks: gain, THD, EQ magnitude/phase, correlation and round-trip latency"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
loudstudio = "loudstudio.cli:main"
loudstudio-gui = "loudstudio.gui:main"

[tool.setuptools]
packages = ["loudstudio"]
