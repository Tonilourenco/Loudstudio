name: Build Mac app

# Builds "Desk Check.app" for Apple Silicon and Intel Macs, self-tests each
# app, and publishes both as zips on the "Desk Check for Mac" release.
on:
  push:
    branches: [main, claude/sweet-bardeen-2n7smz]
    paths:
      - "deskcheck/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/mac-app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pytest

      - name: Unit tests
        run: python -m pytest -q

      - name: Build Desk Check.app
        run: |
          python packaging/make_icon.py packaging/build/icon.png
          pyinstaller --noconfirm --clean --distpath dist --workpath build/pyi packaging/desk_check.spec
          # Ad-hoc sign the whole bundle (Apple Silicon refuses unsigned code).
          codesign --force --deep --sign - "dist/Desk Check.app"
          codesign --verify --deep --strict "dist/Desk Check.app"
          plutil -extract NSMicrophoneUsageDescription raw "dist/Desk Check.app/Contents/Info.plist"

      - name: Self-test the built app
        run: '"dist/Desk Check.app/Contents/MacOS/Desk Check" --selftest'

      - name: Zip
        run: ditto -c -k --keepParent "dist/Desk Check.app" "Desk-Check-Mac-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: Desk-Check-Mac-${{ matrix.arch }}.zip
          retention-days: 14

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish to the "Desk Check for Mac" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          shopt -s nullglob
          files=(out/*.zip)
          if [ ${#files[@]} -eq 0 ]; then echo "No app was built"; exit 1; fi
          cat > notes.md <<'NOTES'
          Latest build of **Desk Check** for Mac, made automatically from the code.

          **Which file?** Apple menu → About This Mac. If "Chip" says *Apple M…*, download
          `Desk-Check-Mac-apple-silicon.zip`. If it says *Processor … Intel*, download
          `Desk-Check-Mac-intel.zip`.

          **Install:** open the downloaded zip, drag **Desk Check** into **Applications**.

          **First launch:** macOS blocks apps from unregistered developers once.
          Double-click Desk Check, click **Done** (or OK), then open
          **System Settings → Privacy & Security**, scroll down and click
          **Open Anyway** next to "Desk Check", and confirm. After that it opens normally.
          When asked, allow **microphone** access - that is how Desk Check records your
          audio interface.
          NOTES
          gh release delete mac-app --cleanup-tag --yes || true
          gh release create mac-app "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "Desk Check for Mac" \
            --notes-file notes.md
